name: Rust CI (Shared)
on:
  workflow_call:
jobs:
  test:
    name: Check, Test & Verify Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo Check
        run: cargo check --workspace --all-targets
      - name: Cargo Test
        run: cargo test --workspace

  gui-headless-matrix:
    name: GUI Headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            headless: true
          - os: macos-latest
            headless: false
          - os: windows-latest
            headless: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Linux: install Xvfb + Mesa software drivers
      - name: Setup Headless Display (Linux)
        if: matrix.headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers mesa-utils libxkbcommon-x11-0
        shell: bash

      - name: Run GUI Headless Tests
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          if [ "${{ matrix.headless }}" = "true" ]; then
            xvfb-run -a cargo test -p agam_gui --features headless-test
          else
            cargo test -p agam_gui --features headless-test
          fi
        shell: bash
