name: Rust CI (Shared)
on:
  workflow_call:
jobs:
  test:
    name: Check, Test & Verify Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cargo Check
        run: cargo check --workspace --all-targets
      - name: Cargo Test
        run: cargo test --workspace
